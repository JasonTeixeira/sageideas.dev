name: E2E + RLS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: RLS isolation tests
        if: github.event_name == 'workflow_dispatch' && vars.RLS_TEST_ALLOW_REMOTE == 'true'
        run: npm run test:rls
        env:
          RLS_TEST_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          RLS_TEST_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          RLS_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RLS_TEST_ALLOW_REMOTE: ${{ vars.RLS_TEST_ALLOW_REMOTE }}
          SAGE_TEST_CLIENT1_PASSWORD: ${{ secrets.SAGE_TEST_CLIENT1_PASSWORD }}
          SAGE_TEST_CLIENT2_PASSWORD: ${{ secrets.SAGE_TEST_CLIENT2_PASSWORD }}
      - name: PR-safe local critical journeys
        run: npm run test:critical-journeys:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
